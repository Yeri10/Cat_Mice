<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Cat & Mouse Room</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- socket -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- p5 -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>

  <!-- 样式 -->
  <link rel="stylesheet" href="style.css"/>

  <!-- 页面层级控制 -->
  <style>
    html,body{
      margin:0;
      padding:0;
      height:100%;
      overflow:hidden;
    }

    /* p5 canvas：透明叠加 */
    canvas{
      position:fixed !important;
      inset:0 !important;
      z-index:5;
      background:transparent !important;
      pointer-events:none;
    }

    /* HUD */
    #hud{
      z-index:10;
    }

    /* lobby */
    #lobbyOverlay{
      z-index:20;
    }
  </style>
</head>

<body class="scene-cover">

  <div id="coverScene" class="scene-layer">
    <div id="lobbyOverlay" class="overlay">
      <div class="panel">
        <div class="title">Cat, Mice</div>
        <div class="sub">
          Sit first, then start. 1-4 players supported.
        </div>

        <div class="nav-mode-wrap">
          <div class="table-title">GPS Navigation Mode</div>
          <div class="mode-buttons">
            <button id="modeVirtualBtn" class="secondary mode-btn active" type="button">Virtual Map</button>
            <button id="modeApiBtn" class="secondary mode-btn" type="button">Real Map</button>
          </div>
        </div>

        <div class="stage">
          <div class="table-title">Seats (Seat 1 host-only)</div>
          <div id="seats" class="seats"></div>
          <div id="roomLine" class="room-line"></div>
          <div id="statusText" class="room-line"></div>
          <div id="errorText" class="error"></div>

          <div class="start-wrap">
            <button id="hostBtn" class="secondary">Become Host</button>
            <button id="startBtn" class="warn">Start game (host only)</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="gameScene" class="scene-layer">
    <div id="hud">
      <div class="timer-line" id="timer">--:--</div>
    </div>
    <div id="gpsPanel" class="gps-panel">
      <div id="gpsModeLine" class="gps-mode">GPS: Virtual Map Navigation</div>
      <div id="virtualGpsControls" class="gps-controls">
        <label for="virtualTarget">Virtual Destination</label>
        <select id="virtualTarget">
          <option value="north_gate">北门</option>
          <option value="east_storage">东仓库</option>
          <option value="south_hall">南大厅</option>
          <option value="west_corner">西角落</option>
          <option value="center">中央点</option>
        </select>
      </div>
      <div id="gpsOutput" class="gps-output">等待导航启动...</div>
      <div id="gpsMap" class="gps-map hidden"></div>
      <div id="realMapHud" class="real-map-hud hidden">
        <div class="rm-top">
          <div class="rm-title">Cat & Mice Outdoor (Real Map)</div>
          <div class="rm-sub" id="rmStatus">Locating...</div>
        </div>
        <div class="rm-left">
          <div class="rm-pill">
            <div class="rm-num" id="rmSpeed">0.0</div>
            <div class="rm-unit">m/s</div>
          </div>
          <div class="rm-pill">
            <div class="rm-num" id="rmDist">0.00</div>
            <div class="rm-unit">km</div>
          </div>
          <div class="rm-pill">
            <div class="rm-num small" id="rmTimer">--:--</div>
            <div class="rm-unit">countdown</div>
          </div>
        </div>
        <div class="rm-right">
          <button type="button">◎</button>
          <button type="button">⌕</button>
          <button type="button">⚙</button>
        </div>
        <div class="rm-chat" id="rmChat">
          <div class="rm-chat-line">Me: stay moving.</div>
          <div class="rm-chat-line">Me: spread out.</div>
        </div>
      </div>
    </div>
  </div>


  <!-- game map painter -->
  <script src="map.js"></script>

  <!-- player controller -->
  <script src="player.js"></script>

  <!-- gps navigation controller -->
  <script src="gps.js"></script>

  <!-- p5 sketch -->
  <script src="sketch.js"></script>

</body>
</html>
